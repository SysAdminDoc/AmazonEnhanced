<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>AmazonEnhanced Price History</title>
<link rel="stylesheet" href="popup.css" />
<style>
  html, body { width: 100%; height: 100%; min-height: 0; max-height: none; }
  body { display: flex; flex-direction: column; }
  .amze-sp-header { flex: none; padding: 18px 20px 14px; background: var(--chrome); border-bottom: 1px solid var(--border-soft); }
  .amze-sp-brand { display: flex; align-items: center; gap: 10px; }
  .amze-sp-header h1 { margin: 0; font-size: 16px; color: var(--heading); }
  .amze-sp-caption { color: var(--muted); font-size: 12px; margin: 10px 0 0; line-height: 1.5; }
  .amze-sp-content { flex: 1; min-height: 0; overflow: auto; padding: 16px 20px; scrollbar-width: thin; scrollbar-color: var(--border) var(--bg); }
  .amze-sp-empty { color: var(--muted); font-size: 13px; padding: 24px 8px; text-align: center; }
  .amze-sp-item { background: var(--panel); border: 1px solid var(--border-soft); border-radius: 8px; padding: 14px; margin-bottom: 12px; }
  .amze-sp-item-title { font-size: 13px; font-weight: 600; margin-bottom: 10px; overflow-wrap: anywhere; }
  .amze-sp-item-title a { color: var(--text); text-decoration: none; }
  .amze-sp-item-title a:hover { color: var(--accent); text-decoration: underline; }
  .amze-sp-prices { font-size: 11px; color: var(--muted); display: flex; gap: 12px; flex-wrap: wrap; }
  .amze-sp-prices strong { display: block; color: var(--text); font-size: 14px; margin-top: 2px; }
  .amze-sp-sparkline { margin-top: 14px; }
  .amze-sp-sparkline svg { display: block; width: 100%; height: 36px; color: var(--accent); }
  .amze-sp-observed { color: var(--muted); font-size: 11px; margin-top: 10px; }
  .amze-sp-alert { font-size: 12px; color: var(--warning); margin-top: 4px; }
  .amze-sp-tabs { display: flex; flex: none; gap: 6px; padding: 10px 20px; border-bottom: 1px solid var(--border-soft); }
  .amze-sp-tab { background: transparent; color: var(--muted); border: 1px solid transparent; padding: 7px 12px; border-radius: 6px; font-size: 12px; font-family: inherit; cursor: pointer; }
  .amze-sp-tab.active { color: var(--text); background: var(--accent-soft); border-color: var(--accent); }
</style>
</head>
<body>
<header class="amze-sp-header">
  <div class="amze-sp-brand">
    <img src="icons/32.png" alt="" width="20" height="20" />
    <h1>AmazonEnhanced</h1>
  </div>
  <p class="amze-sp-caption">Prices you've recorded in this browser. Currency isn't stored, so compare within one marketplace.</p>
</header>

<div class="amze-sp-tabs">
  <button class="amze-sp-tab active" data-view="history" aria-pressed="true">Price History</button>
  <button class="amze-sp-tab" data-view="alerts" aria-pressed="false">Alerts</button>
</div>

<main class="amze-sp-content" id="sp-content" aria-live="polite">
  <div class="amze-sp-empty" id="sp-empty">
    Browse Amazon product pages to build your price history.
  </div>
  <div id="sp-list"></div>
</main>

<script src="browser-polyfill.min.js"></script>
<script src="error-buffer.js"></script>
<script src="sidepanel.js"></script>
</body>
</html>
